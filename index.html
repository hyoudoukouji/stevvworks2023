<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Retro Anime Zone</title>
  <style>
    body {
      background: url('https://i.imgur.com/your-background.jpg') repeat;
      color: #ff66cc;
      font-family: "Comic Sans MS", cursive, sans-serif;
      text-align: center;
    }
    h1 {
      font-size: 48px;
      text-shadow: 2px 2px #000;
      margin-top: 50px;
    }
    .container {
      border: 5px dashed #ffcc00;
      background-color: rgba(0, 0, 0, 0.7);
      width: 80%;
      margin: auto;
      padding: 20px;
    }
    a {
      color: #00ffff;
      text-decoration: none;
      font-weight: bold;
    }
    a:hover {
      color: #ff0000;
    }
    img {
      width: 300px;
      border: 3px solid #fff;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>🌸 Retro Anime Zone 🌸</h1>
  <div class="container">
    <p>Welcome to the ultimate throwback anime fan site!</p>
    <img src="https://i.imgur.com/your-anime-image.jpg" alt="Classic Anime">
    <p><a href="#">Enter the Gallery</a> | <a href="#">Fanfiction</a> | <a href="#">Guestbook</a></p>
  </div>
</body>
</html>
